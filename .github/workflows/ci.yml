name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: &paths-ignore
      - '**.md'
      - 'docs/**'
      - '.cursor/**/*.md'
      - '.cursorrules'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main, develop]
    paths-ignore: *paths-ignore

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Volta
        uses: volta-cli/action@v4

      - name: Verify versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        working-directory: apps/backend
        run: pnpm install

      - name: Run lint
        working-directory: apps/backend
        run: pnpm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Volta
        uses: volta-cli/action@v4

      - name: Verify versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        working-directory: apps/backend
        run: pnpm install

      - name: Build
        working-directory: apps/backend
        run: pnpm run build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Volta
        uses: volta-cli/action@v4

      - name: Verify versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        working-directory: apps/backend
        run: pnpm install

      - name: Run unit tests
        working-directory: apps/backend
        run: pnpm run test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: apps/backend/coverage/
          if-no-files-found: ignore

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Volta
        uses: volta-cli/action@v4

      - name: Verify versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        working-directory: apps/backend
        run: pnpm install

      - name: Run E2E tests
        working-directory: apps/backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_EXPIRES_IN: 86400
          BCRYPT_SALT_ROUNDS: 10
        run: pnpm run test:e2e


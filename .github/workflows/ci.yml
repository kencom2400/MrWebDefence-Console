name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: &paths-ignore
      - '**.md'
      - 'docs/**'
      - '.cursor/**/*.md'
      - '.cursorrules'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main, develop]
    paths-ignore: *paths-ignore

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Volta
        uses: volta-cli/action@v4

      - name: Install Node.js via Volta
        run: volta install node

      - name: Install pnpm via Volta
        run: volta install pnpm

      - name: Verify versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        working-directory: apps/backend
        run: pnpm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Volta
        uses: volta-cli/action@v4

      - name: Install Node.js via Volta
        run: volta install node

      - name: Install pnpm via Volta
        run: volta install pnpm

      - name: Verify versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Build
        working-directory: apps/backend
        run: pnpm run build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Volta
        uses: volta-cli/action@v4

      - name: Install Node.js via Volta
        run: volta install node

      - name: Install pnpm via Volta
        run: volta install pnpm

      - name: Verify versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Rebuild native modules
        working-directory: apps/backend
        run: npm rebuild bcrypt

      - name: Run unit tests
        working-directory: apps/backend
        run: pnpm run test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: apps/backend/coverage/
          if-no-files-found: ignore

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: mrwebdefence_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Volta
        uses: volta-cli/action@v4

      - name: Install Node.js via Volta
        run: volta install node

      - name: Install pnpm via Volta
        run: volta install pnpm

      - name: Verify versions
        run: |
          node --version
          pnpm --version
          docker --version
          docker-compose --version || docker compose version

      - name: Install dependencies
        run: pnpm install

      - name: Install Flyway CLI
        run: |
          FLYWAY_VERSION=10.0.0
          wget -qO- https://download.red-gate.com/maven/release/org/flywaydb/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz | tar xvz -C /tmp
          sudo ln -sf /tmp/flyway-${FLYWAY_VERSION}/flyway /usr/local/bin/flyway
          flyway --version

      - name: Run database migrations
        working-directory: apps/backend
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test-password
          DB_NAME: mrwebdefence_test
        run: |
          pnpm run migrate:test
          pnpm run migrate

      - name: Build Docker image
        run: docker-compose build backend || docker compose build backend

      - name: Run E2E tests via Docker Compose
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_EXPIRES_IN: 1800
          BCRYPT_SALT_ROUNDS: 10
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test-password
          DB_NAME: mrwebdefence_test
        run: |
          chmod +x scripts/backend/test.sh
          ./scripts/backend/test.sh e2e

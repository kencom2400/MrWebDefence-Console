name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: &paths-ignore
      - '**.md'
      - 'docs/**'
      - '.cursor/**/*.md'
      - '.cursorrules'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main, develop]
    paths-ignore: *paths-ignore

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Volta
        uses: volta-cli/action@v4

      - name: Install Node.js via Volta
        run: volta install node

      - name: Install pnpm via Volta
        run: volta install pnpm

      - name: Verify versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        working-directory: apps/backend
        run: pnpm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Volta
        uses: volta-cli/action@v4

      - name: Install Node.js via Volta
        run: volta install node

      - name: Install pnpm via Volta
        run: volta install pnpm

      - name: Verify versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Build
        working-directory: apps/backend
        run: pnpm run build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Volta
        uses: volta-cli/action@v4

      - name: Install Node.js via Volta
        run: volta install node

      - name: Install pnpm via Volta
        run: volta install pnpm

      - name: Verify versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Rebuild native modules
        working-directory: apps/backend
        run: npm rebuild bcrypt

      - name: Run unit tests
        working-directory: apps/backend
        run: pnpm run test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: apps/backend/coverage/
          if-no-files-found: ignore

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Volta
        uses: volta-cli/action@v4

      - name: Install Node.js via Volta
        run: volta install node

      - name: Install pnpm via Volta
        run: volta install pnpm

      - name: Verify versions
        run: |
          node --version
          pnpm --version
          docker --version
          docker-compose --version || docker compose version

      - name: Install dependencies
        run: pnpm install

      - name: Build Docker image
        run: docker-compose build backend || docker compose build backend

      - name: Run E2E tests via Docker Compose
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_EXPIRES_IN: 1800
          BCRYPT_SALT_ROUNDS: 10
        run: |
          chmod +x scripts/backend/test.sh
          ./scripts/backend/test.sh e2e


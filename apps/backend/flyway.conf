# Flyway Configuration
# 
# データベース接続情報は環境変数から取得します
# デフォルト値はシェルスクリプト側で管理されます

# データベース接続URL
flyway.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}

# データベース接続ユーザー名
flyway.user=${DB_USER}

# データベース接続パスワード
# セキュリティのため、DB_PASSWORDが未設定の場合はエラーになります
flyway.password=${DB_PASSWORD}

# マイグレーションファイルの配置場所
# filesystem: を使用してファイルシステム上のパスを指定
flyway.locations=filesystem:apps/backend/src/db/migration,filesystem:apps/backend/src/db/seed

# 初回マイグレーション時にベースラインを作成
flyway.baselineOnMigrate=true

# マイグレーション実行前にバリデーションを実行
flyway.validateOnMigrate=true

# 文字コード
flyway.encoding=UTF-8

# スキーマ名（MySQLの場合はデータベース名）
flyway.schemas=${DB_NAME}

# 接続タイムアウト（秒）
flyway.connectRetries=3

# 接続リトライ間隔（秒）
flyway.connectRetriesInterval=10
